name: Count Semantic .se files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/count-semantic-se.yml

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count tracked .se files
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            "SemanticProgrammingLanguage/Semantic-Gio-UI"
            "SemanticProgrammingLanguage/Semantic-Tkinter"
            "SemanticProgrammingLanguage/Semantic-Numpy"
            "SemanticProgrammingLanguage/Semantic-Go-Webview2"
            "SemanticProgrammingLanguage/Semantic-Chroma-Synthax-Highliting-Module"
            "tarekwasfy01/Semantic-Programming-Language"
          )
          tmp="$(mktemp -d)"
          rows="$(mktemp)"
          total=0
          for repo in "${repos[@]}"; do
            name="${repo#*/}"
            git clone --depth 1 "https://github.com/${repo}.git" "$tmp/$name"
            count="$(find "$tmp/$name" -type f -name '*.se' -not -path '*/.git/*' | wc -l | tr -d ' ')"
            printf '| [%s](https://github.com/%s) | %s |\n' "$repo" "$repo" "$count" >> "$rows"
            total=$((total + count))
          done
          python3 - "$rows" "$total" <<'PY'
          from pathlib import Path
          import sys
          rows = Path(sys.argv[1]).read_text().rstrip()
          total = sys.argv[2]
          p = Path('linguist/SEARCH_EVIDENCE.md')
          text = p.read_text()
          start = '<!-- VERIFIED-SE-COUNT-START -->'
          end = '<!-- VERIFIED-SE-COUNT-END -->'
          lines = [
              start,
              '## Verified repository-tree count of `.se` files',
              '',
              'The following count was produced from the current `main`/default branches by cloning the public repositories and counting working-tree files whose names end in `.se`. File size is intentionally irrelevant to this repository-tree count.',
              '',
              '| Repository | `.se` files |',
              '| --- | ---: |',
              rows,
              f'| **Total** | **{total}** |',
              '',
              "This is a count of `.se` files physically present in the listed public repository working trees. It must not be presented as GitHub Code Search's indexed-file count; GitHub's search index may lag or omit large files.",
              end,
          ]
          block = '\n'.join(lines)
          if start in text and end in text:
              before = text.split(start, 1)[0].rstrip()
              after = text.split(end, 1)[1].lstrip()
              text = before + '\n\n' + block + '\n\n' + after
          else:
              marker = '## Known public Semantic repositories'
              if marker in text:
                  text = text.replace(marker, block + '\n\n' + marker, 1)
              else:
                  text += '\n\n' + block + '\n'
          p.write_text(text)
          print(f'VERIFIED_SE_TOTAL={total}')
          PY

      - name: Commit count and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/count-semantic-se.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record verified Semantic .se file counts'
          git push origin HEAD:main
